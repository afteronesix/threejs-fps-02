<!DOCTYPE html>
<html lang="en">
<head>
<!-- SANDLINE — a 5v5 bomb-defusal FPS (player + 4 bots vs 5 bots) in Three.js.
     JUDGE MAP: game loop + wiring in src/main.js (fixed 60 Hz sim, decoupled
     render); movement/collision src/player.js; weapons/spread/recoil
     src/weapons.js; hitscan nearest-hit resolution + grenades src/combat.js;
     bot squad AI (routes, hearing, vision, plant/defuse duties) src/bots.js;
     economy src/economy.js; bomb plant/defuse channels src/bomb.js; round
     machine src/rounds.js; map src/world.js; HUD src/hud.js. No network, no
     assets: all art is geometry, all sound is synthesized WebAudio. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANDLINE — Bomb Defusal FPS</title>
<style>
  :root {
    --ink: #17130e; --panel: rgba(18, 15, 11, 0.82); --line: rgba(236, 229, 216, 0.16);
    --text: #ece5d8; --muted: #b8a888; --amber: #e8a33d; --teal: #3ec6b8; --ember: #e05d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  /* Crosshair: four ticks whose gap tracks live spread (set from JS). */
  #crosshair { --gap: 6px; position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: var(--text); box-shadow: 0 0 3px rgba(0,0,0,.8); }
  #crosshair i:nth-child(1) { left: -1px; top: calc(-10px - var(--gap)); width: 2px; height: 8px; }
  #crosshair i:nth-child(2) { left: -1px; top: var(--gap); width: 2px; height: 8px; }
  #crosshair i:nth-child(3) { top: -1px; left: calc(-10px - var(--gap)); height: 2px; width: 8px; }
  #crosshair i:nth-child(4) { top: -1px; left: var(--gap); height: 2px; width: 8px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; }
  #hitmarker.on { opacity: 1; }
  #hitmarker i { position: absolute; background: #fff; }
  #hitmarker i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 9px; }
  #hitmarker i:nth-child(2) { left: 12px; bottom: 0; width: 2px; height: 9px; }
  #hitmarker i:nth-child(3) { top: 12px; left: 0; height: 2px; width: 9px; }
  #hitmarker i:nth-child(4) { top: 12px; right: 0; height: 2px; width: 9px; }
  #hitmarker.headshot i { background: var(--amber); }
  #damage-flash { position: absolute; inset: 0; box-shadow: inset 0 0 90px 30px rgba(224, 93, 61, 0.55); opacity: 0; transition: opacity .18s; }
  #damage-flash.on { opacity: 1; }

  /* Top bar: score, round, timer. */
  #topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; background: var(--panel); border: 1px solid var(--line); padding: 8px 20px; }
  #topbar .team { font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  #topbar .team.a { color: var(--teal); } #topbar .team.b { color: var(--ember); }
  #score-a, #score-b { font-size: 24px; font-weight: 800; }
  #round-value { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
  #topbar-mid { display: flex; align-items: baseline; gap: 10px; }
  #timer-label { font-size: 10px; letter-spacing: .18em; color: var(--muted); }
  #timer-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #timer-value.urgent { color: var(--ember); }
  #bomb-status { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--amber); color: var(--amber); padding: 6px 14px; font-size: 13px; font-weight: 700; letter-spacing: .1em; }
  #bomb-status.urgent { color: var(--ember); border-color: var(--ember); }

  /* Rosters. */
  .roster { position: absolute; top: 14px; width: 168px; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
  #roster-a { left: 14px; border-top: 2px solid var(--teal); }
  #roster-b { right: 14px; border-top: 2px solid var(--ember); }
  .roster-title { font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-bottom: 6px; }
  .roster-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .roster-row.dead { opacity: .35; text-decoration: line-through; }
  .roster-name { flex: 0 0 52px; font-weight: 600; letter-spacing: .05em; }
  .roster-hp { flex: 1; height: 5px; background: rgba(255,255,255,.12); }
  .roster-hp i { display: block; height: 100%; background: var(--teal); }
  #roster-b .roster-hp i { background: var(--ember); }

  /* Kill feed. */
  #killfeed { position: absolute; top: 170px; right: 14px; text-align: right; font-size: 13px; }
  .killfeed-entry { background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; margin: 4px 0; }
  .killfeed-entry span { color: var(--muted); font-size: 11px; margin: 0 6px; }

  /* Bottom left: health + armour. Bottom right: weapon + ammo. */
  #vitals { position: absolute; left: 14px; bottom: 14px; background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; min-width: 190px; }
  #health-value { font-size: 34px; font-weight: 800; line-height: 1; }
  #health-bar { height: 6px; background: rgba(255,255,255,.12); margin: 6px 0 4px; }
  #health-fill { display: block; height: 100%; background: var(--teal); }
  #health-fill.low { background: var(--ember); }
  #armor-line { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  #ammo { position: absolute; right: 14px; bottom: 14px; background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; text-align: right; min-width: 210px; }
  #ammo.empty #ammo-mag { color: var(--ember); }
  #weapon-name { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
  #ammo-mag { font-size: 34px; font-weight: 800; line-height: 1; }
  #ammo-reserve { font-size: 16px; color: var(--muted); }
  #grenades { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-top: 4px; }
  #grenades span { margin-left: 12px; }
  #money { position: absolute; right: 14px; bottom: 122px; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; font-size: 15px; font-weight: 700; color: var(--amber); }
  #minimap { position: absolute; left: 14px; bottom: 122px; border: 1px solid var(--line); background: var(--panel); }
  #hint { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); font-size: 14px; font-weight: 700; letter-spacing: .12em; color: var(--amber); text-shadow: 0 1px 4px #000; }
  #spectate { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); font-size: 13px; letter-spacing: .1em; color: var(--text); background: var(--panel); padding: 6px 14px; border: 1px solid var(--line); }

  /* Round banner. */
  #banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 22px 48px; }
  #banner-title { font-size: 36px; font-weight: 800; letter-spacing: .1em; }
  #banner-reason { font-size: 15px; color: var(--muted); margin-top: 6px; }
  #banner-payout { font-size: 15px; color: var(--amber); font-weight: 700; margin-top: 4px; }

  /* Buy menu. */
  #buy-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--amber); padding: 20px 24px; width: 420px; pointer-events: auto; }
  #buy-menu h2 { font-size: 16px; letter-spacing: .16em; margin-bottom: 4px; }
  #buy-money { color: var(--amber); font-weight: 800; font-size: 18px; margin-bottom: 12px; }
  .buy-item { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 1px solid var(--line); color: var(--text); padding: 9px 12px; margin: 6px 0; cursor: pointer; font-size: 14px; text-align: left; }
  .buy-item:hover:not(:disabled) { border-color: var(--amber); }
  .buy-item:disabled { opacity: .4; cursor: default; }
  .buy-key { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .buy-name { flex: 1; font-weight: 600; }
  .buy-price { color: var(--amber); font-weight: 700; }
  .buy-owned { font-size: 10px; letter-spacing: .12em; color: var(--teal); }

  /* Start / pause / match-end overlay. */
  #overlay { position: fixed; inset: 0; background: rgba(10, 8, 6, 0.78); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay[hidden] { display: none; }
  #overlay-panel { text-align: center; max-width: 560px; padding: 32px; }
  #overlay-title { font-size: 52px; font-weight: 800; letter-spacing: .14em; color: var(--amber); }
  #overlay-copy { font-size: 15px; line-height: 1.6; color: var(--text); margin: 14px 0 22px; }
  #play { background: var(--amber); color: #17130e; border: none; padding: 13px 42px; font-size: 17px; font-weight: 800; letter-spacing: .14em; cursor: pointer; }
  #play:hover { filter: brightness(1.1); }
  #keys { margin-top: 18px; font-size: 12px; color: var(--muted); letter-spacing: .06em; line-height: 1.8; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="damage-flash"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

  <div id="topbar">
    <span class="team a">VANGUARD</span><span id="score-a">0</span>
    <div id="topbar-mid"><span id="round-value">ROUND 1</span><span id="timer-value">0:15</span><span id="timer-label">BUY</span></div>
    <span id="score-b">0</span><span class="team b">EMBER</span>
  </div>
  <div id="bomb-status" class="hidden"></div>

  <div class="roster" id="roster-a"><div class="roster-title">VANGUARD — ATTACK</div></div>
  <div class="roster" id="roster-b"><div class="roster-title">EMBER — DEFEND</div></div>
  <div id="killfeed"></div>

  <canvas id="minimap" width="168" height="132"></canvas>
  <div id="vitals">
    <div><span id="health-value">100</span></div>
    <div id="health-bar"><i id="health-fill" style="width:100%"></i></div>
    <div id="armor-line">ARMOUR <span id="armor-value">—</span></div>
  </div>
  <div id="money">$<span id="money-value">800</span></div>
  <div id="ammo">
    <div id="weapon-name">P9 SIDEARM</div>
    <div><span id="ammo-mag">12</span> <span id="ammo-reserve">/ 48</span></div>
    <div id="grenades"><span id="grenade-frag">FRAG x0</span><span id="grenade-smoke">SMOKE x0</span></div>
  </div>
  <div id="hint"></div>
  <div id="spectate" class="hidden"></div>

  <div id="banner" class="hidden">
    <div id="banner-title">ROUND WON</div>
    <div id="banner-reason"></div>
    <div id="banner-payout"></div>
  </div>

  <div id="buy-menu" class="hidden">
    <h2>BUY EQUIPMENT</h2>
    <div id="buy-money">$800</div>
    <div id="buy-list"></div>
  </div>
</div>

<div id="overlay" hidden>
  <div id="overlay-panel">
    <div id="overlay-title">SANDLINE</div>
    <div id="overlay-copy"></div>
    <button id="play" type="button">DEPLOY</button>
    <div id="keys">WASD MOVE &nbsp;·&nbsp; MOUSE AIM &nbsp;·&nbsp; CLICK FIRE &nbsp;·&nbsp; R RELOAD<br>
    E PLANT &nbsp;·&nbsp; B BUY &nbsp;·&nbsp; G FRAG &nbsp;·&nbsp; F SMOKE &nbsp;·&nbsp; CTRL CROUCH &nbsp;·&nbsp; SPACE JUMP</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
